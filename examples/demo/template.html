<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>stratum-motion demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f5f3;
        --panel: #ffffff;
        --ink: #16161a;
        --muted: #6b6b76;
        --line: #e2e0dc;
        --accent: #2f6f4f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101014;
          --panel: #17171d;
          --ink: #f2f2f0;
          --muted: #9a9aa6;
          --line: #26262f;
          --accent: #6fd39b;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 62rem; margin: 0 auto; padding: 0 1.5rem 8rem; }
      section { padding: 6rem 0; border-bottom: 1px solid var(--line); }
      h1 { font-size: clamp(2.2rem, 6vw, 3.6rem); line-height: 1.1; margin: 0 0 1rem; letter-spacing: -0.02em; }
      h2 { font-size: 1.5rem; margin: 0 0 0.5rem; letter-spacing: -0.01em; }
      p { color: var(--muted); max-width: 46ch; }
      code { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 0.9em; }
      .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); list-style: none; padding: 0; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 0.75rem; padding: 1.25rem; }
      .band { position: relative; overflow: hidden; border-radius: 1rem; height: 22rem; background: var(--panel); border: 1px solid var(--line); }
      .band-layer { position: absolute; inset: -20% 0; display: grid; place-items: center; font-size: 4rem; font-weight: 700; opacity: 0.18; }
      .bar { height: 0.6rem; border-radius: 999px; background: var(--accent); transition: none; }
      .toolbar { position: sticky; top: 0; z-index: 10; display: flex; gap: 0.75rem; align-items: center; padding: 0.75rem 1.5rem; background: var(--panel); border-bottom: 1px solid var(--line); }
      button { font: inherit; padding: 0.4rem 0.9rem; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; }
      button[aria-pressed='true'] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
      .spacer { height: 60vh; }
    </style>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="./dist/demo.js"></script>
  </body>
</html>
